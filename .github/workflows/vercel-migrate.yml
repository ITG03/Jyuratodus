name: Deploy and run migrations on Vercel

on:
  push:
    branches:
      - main

jobs:
  deploy-and-migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install deps
        run: npm ci

      - name: Commit built assets (if any)
        run: echo 'skip'

      - name: Wait for Vercel deployment
        run: |
          echo "Waiting for 30s to let Vercel pick up the push..."
          sleep 30

      - name: Call migration endpoint
        env:
          MIGRATE_SECRET: ${{ secrets.MIGRATE_SECRET }}
          VERCEL_PROJECT_URL: ${{ secrets.VERCEL_PROJECT_URL }}
        run: |
          if [ -z "$VERCEL_PROJECT_URL" ] || [ -z "$MIGRATE_SECRET" ]; then
            echo "VERCEL_PROJECT_URL or MIGRATE_SECRET is not set in repo secrets"; exit 1
          fi
          curl -sS "$VERCEL_PROJECT_URL/api/migrate?secret=$MIGRATE_SECRET" | jq || true
